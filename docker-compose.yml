services:
  db:
    image: postgis/postgis:16-3.4
    container_name: blokm-db
    environment:
      POSTGRES_USER: blokm
      POSTGRES_PASSWORD: blokm
      POSTGRES_DB: blokm
    ports:
      - "5432:5432"
    volumes:
      - blokm_pg:/var/lib/postgresql/data
      - ./api/internal/fsdata/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blokm -d blokm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blokm_pg:
